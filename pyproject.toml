[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thehr"
version = "1.0.0"
description = "AI-Powered Human Resources Operating System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = "app/tests"
addopts = "-v --tb=short"
[tool.ruff]
target-version = "py312"
line-length = 120
